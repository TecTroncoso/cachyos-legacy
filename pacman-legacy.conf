[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# REPOSITORIOS CACHYOS (Solo la capa genérica. ¡Prohibido v3 y v4!)
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# REPOSITORIOS OFICIALES DE ARCH LINUX (Base estable)
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
