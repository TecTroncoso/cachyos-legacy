name: Construir CachyOS Legacy (XFCE)

on:
  workflow_dispatch:
    inputs:
      iso_name:
        description: 'Nombre de tu ISO (sin espacios ni .iso)'
        required: true
        default: 'CachyOS-Legacy'
      version_tag:
        description: 'Versión del lanzamiento (ej. v1.1)'
        required: true
        default: 'v1.4'

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: 📥 1. Descargar nuestros archivos
        uses: actions/checkout@v4

      - name: 🛠️ 2. Preparar el entorno y blindar repositorios
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git archiso mkinitcpio-archiso sudo base-devel zstd curl wget unzip tar grub dosfstools
          
          pacman-key --init
          pacman-key --populate archlinux
          
          wget https://mirror.cachyos.org/cachyos-repo.tar.xz
          tar xvf cachyos-repo.tar.xz
          cd cachyos-repo
          yes | ./cachyos-repo.sh
          cd ..
          
          # ¡BARRERA DE SEGURIDAD! Destruimos los repositorios modernos en la máquina de compilación
          sed -i '/\[cachyos-v3\]/,+2d' /etc/pacman.conf
          sed -i '/\[cachyos-v4\]/,+2d' /etc/pacman.conf
          rm -f /etc/pacman.d/cachyos-v*-mirrorlist

          # Destruimos los repositorios modernos en la máquina de compilación
          sed -i '/-v[34]\]/,+2d' /etc/pacman.conf
          rm -f /etc/pacman.d/cachyos-v*-mirrorlist

      - name: 📦 3. Clonar la base de CachyOS
        run: |
          git clone https://github.com/CachyOS/CachyOS-Live-ISO.git builder

      - name: 💉 4. Inyectar Optimizaciones y Configuraciones
        run: |
          # 1. Copiar lista de paquetes y repositorios
          cp pacman-legacy.conf builder/archiso/pacman.conf
          cp packages-legacy.txt builder/archiso/packages.x86_64

          # ---> 🟢 NUEVO PARCHE: SOLUCIÓN AL ERROR DE BOOST <---
          # 4.5 🧰 PARCHE DE BOOST (boost-libs 1.89.0 para revivir a Calamares Legacy)
          wget https://archive.archlinux.org/packages/b/boost-libs/boost-libs-1.89.0-4-x86_64.pkg.tar.zst
          # Extraemos únicamente los archivos .so específicos a la versión 1.89.0
          tar -I zstd -xvf boost-libs-1.89.0-4-x86_64.pkg.tar.zst --wildcards 'usr/lib/*.so.1.89.0'
          
          # ¡NUEVO! Nos aseguramos de que el directorio de destino exista antes de copiar
          mkdir -p builder/archiso/airootfs/usr/lib/
          
          # Copiamos todas las librerías antiguas extraídas al sistema en vivo (airootfs)
          cp -a usr/lib/libboost_*.so.1.89.0 builder/archiso/airootfs/usr/lib/
          # -----------------------------------------------------

          # 4. 🧰 PARCHE DE LIBRERÍA (yaml-cpp 0.8 para revivir a Calamares)
          wget https://archive.archlinux.org/packages/y/yaml-cpp/yaml-cpp-0.8.0-1-x86_64.pkg.tar.zst
          tar -I zstd -xvf yaml-cpp-0.8.0-1-x86_64.pkg.tar.zst usr/lib/libyaml-cpp.so.0.8.0
          mkdir -p builder/archiso/airootfs/usr/lib/
          cp usr/lib/libyaml-cpp.so.0.8.0 builder/archiso/airootfs/usr/lib/
          ln -sf libyaml-cpp.so.0.8.0 builder/archiso/airootfs/usr/lib/libyaml-cpp.so.0.8
          
          # 2. Encender la Pantalla de Login (LightDM) automáticamente
          mkdir -p builder/archiso/airootfs/etc/systemd/system/
          ln -sf /usr/lib/systemd/system/lightdm.service builder/archiso/airootfs/etc/systemd/system/display-manager.service
          
          # 3. 🚀 OPTIMIZACIÓN EXTREMA: mitigations=off
          # Inyectamos el comando en los archivos de arranque del LiveUSB (Syslinux y Grub)
          find builder/archiso/syslinux builder/archiso/grub -type f -exec sed -i 's/quiet/quiet mitigations=off/g' {} +
          
          # 5. 💿 INSTALADOR: Crear icono con el FIX de permisos nativo de Linux
          mkdir -p builder/archiso/airootfs/usr/local/bin
          cat << 'EOF' > builder/archiso/airootfs/usr/local/bin/instalar-cachyos.sh
          #!/bin/bash
          # PARCHE 1: Arreglar la librería faltante de yaml-cpp (engañando al sistema)
          if [ ! -f /usr/lib/libyaml-cpp.so.0.8 ]; then
              ln -sf /usr/lib/libyaml-cpp.so /usr/lib/libyaml-cpp.so.0.8
          fi
          
          # PARCHE 2: Forzar a Calamares a instalar el kernel LTS en lugar del normal
          find /etc/calamares /usr/share/calamares -type f -exec sed -i 's/linux-cachyos/linux-cachyos-lts/g' {} + 2>/dev/null
                   
          # Iniciar Calamares usando la herramienta nativa de sesión (dbus-run-session)
          exec dbus-run-session -- calamares
          EOF
          chmod +x builder/archiso/airootfs/usr/local/bin/instalar-cachyos.sh
          
          # Crear icono en el escritorio que ejecuta nuestro script de forma segura
          mkdir -p builder/archiso/airootfs/etc/skel/Desktop
          cat << EOF > builder/archiso/airootfs/etc/skel/Desktop/Instalar_CachyOS.desktop
          [Desktop Entry]
          Type=Application
          Name=Instalar CachyOS Legacy
          Comment=Instalador del Sistema
          Exec=pkexec /usr/local/bin/instalar-cachyos.sh
          Icon=drive-harddisk
          Terminal=false
          Categories=System;
          EOF
          chmod +x builder/archiso/airootfs/etc/skel/Desktop/Instalar_CachyOS.desktop
          
          # 6. ¡ARREGLO DE GRUB! Forzamos a que la entrada por defecto use el kernel LTS
          sed -i 's/vmlinuz-linux-cachyos/vmlinuz-linux-cachyos-lts/g' builder/archiso/grub/grub.cfg
          sed -i 's/initramfs-linux-cachyos\.img/initramfs-linux-cachyos-lts.img/g' builder/archiso/grub/grub.cfg
  
      - name: ⚙️ 5. Compilar la ISO (Tardará unos 20 min)
        run: |
          cd builder
          mkarchiso -v -w work_dir -o out archiso/
          
          cd out
          mv *.iso ../../${{ github.event.inputs.iso_name }}-${{ github.event.inputs.version_tag }}-x86_64.iso

      - name: 🎉 6. Publicar automáticamente en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: "Lanzamiento ${{ github.event.inputs.iso_name }} ${{ github.event.inputs.version_tag }}"
          body: "Esta ISO está basada en CachyOS LTS, blindada estrictamente para hardware antiguo (arquitectura x86_64 genérica)."
          files: "*.iso"
          draft: false
          prerelease: false
