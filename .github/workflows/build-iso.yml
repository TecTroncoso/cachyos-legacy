name: Construir CachyOS Legacy (XFCE)

on:
  workflow_dispatch: # Activa el botón de construcción manual

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged # Vital para poder montar discos virtuales

    steps:
      - name: 📥 1. Descargar nuestros archivos
        uses: actions/checkout@v4

      - name: 🛠️ 2. Preparar el entorno limpio de Arch Linux
        run: |
          # Actualizar el sistema base y herramientas de creación de ISOs
          pacman -Syu --noconfirm
          pacman -S --noconfirm git archiso mkinitcpio-archiso sudo base-devel zstd curl
          
          # Configurar las llaves criptográficas temporalmente para bajar los paquetes de CachyOS
          pacman-key --init
          echo "[cachyos]" >> /etc/pacman.conf
          echo "Server = https://mirror.cachyos.org/repo/x86_64/cachyos" >> /etc/pacman.conf
          pacman -Sy --noconfirm cachyos-keyring cachyos-mirrorlist

      - name: 📦 3. Clonar la base de CachyOS
        run: |
          git clone https://github.com/CachyOS/CachyOS-Live-ISO.git builder

      - name: 💉 4. Inyectar nuestra configuración Legacy
        run: |
          # Reemplazamos la configuración de CachyOS por nuestro escudo Legacy
          cp pacman-legacy.conf builder/archiso/pacman.conf
          
          # Reemplazamos su lista de paquetes pesada por la nuestra ligera
          cp packages-legacy.txt builder/archiso/packages.x86_64

      - name: ⚙️ 5. Compilar la ISO (Esto tomará unos 20 minutos)
        run: |
          cd builder
          # Usamos mkarchiso directamente para evitar que los scripts de CachyOS fuercen CPUs modernas
          mkarchiso -v -w work_dir -o out archiso/

      - name: 🚀 6. Subir tu nueva ISO lista para descargar
        uses: actions/upload-artifact@v4
        with:
          name: CachyOS-Legacy-XFCE-ISO
          path: builder/out/*.iso
          retention-days: 5 # La ISO estará disponible 5 días para que la descargues
