name: Construir CachyOS Legacy (XFCE)

on:
  workflow_dispatch:
    inputs:
      iso_name:
        description: 'Nombre de tu ISO (sin espacios ni .iso)'
        required: true
        default: 'CachyOS-Legacy'
      version_tag:
        description: 'Versión del lanzamiento (ej. v1.0)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged # Vital para poder montar discos virtuales

    steps:
      - name: 📥 1. Descargar nuestros archivos
        uses: actions/checkout@v4

      - name: 🛠️ 2. Preparar el entorno y solucionar llaves GPG
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git archiso mkinitcpio-archiso sudo base-devel zstd curl wget unzip tar
          
          # Inicializar llaves base de Arch Linux
          pacman-key --init
          pacman-key --populate archlinux
          
          # Descargar instalador de repositorios de CachyOS
          wget https://mirror.cachyos.org/cachyos-repo.tar.xz
          tar xvf cachyos-repo.tar.xz
          cd cachyos-repo
          
          # ¡AQUÍ ESTÁ LA MAGIA! Obligamos al robot a responder "Sí" a todo
          yes | ./cachyos-repo.sh
          cd ..

      - name: 📦 3. Clonar la base de CachyOS
        run: |
          git clone https://github.com/CachyOS/CachyOS-Live-ISO.git builder

      - name: 💉 4. Inyectar nuestra configuración Legacy
        run: |
          # Reemplazamos la configuración de CachyOS por nuestro escudo Legacy
          cp pacman-legacy.conf builder/archiso/pacman.conf
          # Reemplazamos su lista de paquetes por la nuestra con XFCE y Brave
          cp packages-legacy.txt builder/archiso/packages.x86_64

      - name: ⚙️ 5. Compilar la ISO (Tardará unos 20 min)
        run: |
          cd builder
          # Usamos mkarchiso directamente para esquivar errores
          mkarchiso -v -w work_dir -o out archiso/
          
          # Renombramos la ISO final usando los datos del formulario interactivo
          cd out
          mv *.iso ../../${{ github.event.inputs.iso_name }}-${{ github.event.inputs.version_tag }}-x86_64.iso

      - name: 🎉 6. Publicar automáticamente en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: "Lanzamiento ${{ github.event.inputs.iso_name }} ${{ github.event.inputs.version_tag }}"
          body: "Esta ISO está basada en CachyOS LTS, optimizada para hardware antiguo e incluye XFCE, ZRAM por defecto y Brave Browser."
          files: "*.iso"
          draft: false
          prerelease: false
